[project]
name = "kaggle-jupyter-mcp"
version = "0.1.0"
description = "Kaggle-compatible extensions and REST fallbacks for jupyter-mcp-server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jupyter-mcp-server==1.2.0",
  "nbformat>=5.10",
  "requests>=2.31",
  "typing-extensions>=4.10",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[project.scripts]
kaggle-jupyter-mcp = "kaggle_jupyter_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaggle_jupyter_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
